name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test x86 and x64
        shell: powershell
        run: .\scripts\build.ps1 -Architecture All

      - name: Create combined package
        shell: powershell
        run: .\scripts\package.ps1 -Configuration Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: EditMdView-x86-x64
          path: dist/EditMdView-v*.zip
          if-no-files-found: error
