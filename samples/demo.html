<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>EditMdView HTML 预览</title>
  <style>
    body { max-width: 760px; margin: 48px auto; font: 16px/1.7 "Segoe UI", sans-serif; color: #243047; }
    article { padding: 28px 34px; border: 1px solid #d9e1ec; border-radius: 12px; box-shadow: 0 8px 30px #24304714; }
    code { padding: 2px 6px; border-radius: 4px; background: #eef3f8; }
  </style>
</head>
<body>
  <article>
    <h1>HTML 默认渲染</h1>
    <p>使用顶部的“编辑 / 分栏 / 预览”按钮切换模式，保存后仍保留原文件编码和换行符。</p>
    <p><code>Ctrl+M</code> 可从编辑或分栏模式返回预览。</p>
  </article>
</body>
</html>
