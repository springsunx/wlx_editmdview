# EditMdView 便携版用户设置
# 此处仅包含 EditMdView 已实现的设置项。

# 字体渲染
font.quality=3
# 字体渲染质量。3 表示最高质量（抗锯齿/ClearType 效果最佳）。

font.locale=zh-Hans
# 字体区域设置。zh-Hans 表示简体中文，影响字体回退与字形选择。

font.base=font:Consolas,normal,size:13
# 基础字体。Consolas、正常字重、字号 13，用于编辑器默认文本。

font.comment=font:Consolas,normal,size:12
# 注释字体。Consolas、正常字重、字号 12。

font.monospace=$(font.base)
# 等宽字体。引用上面定义的 font.base，即与基础字体相同。

# Shared language palette. These variables are consumed by the curated
# cpp/html/lisp/conf style definitions and intentionally override the global
# SciTE fallback palette.
# 共享语言配色。这些变量被 cpp/html/lisp/conf 等精选样式定义引用，
# 并有意覆盖 SciTE 的全局回退配色。

colour.code.comment.box=fore:#000080
# 框式注释前景色：深蓝 #000080。

colour.code.comment.line=fore:#007F00
# 行注释前景色：绿色 #007F00。

colour.code.comment.doc=fore:#3F703F
# 文档注释前景色：暗绿 #3F703F。

colour.code.comment.nested=fore:#A0C0A0
# 嵌套注释前景色：浅灰绿 #A0C0A0。

colour.text.comment=fore:#0000FF,back:#D0F0D0
# 文本注释：前景蓝 #0000FF，背景浅绿 #D0F0D0。

colour.other.comment=fore:#007F00
# 其他注释前景色：绿色 #007F00。

colour.embedded.comment=back:#E0EEFF
# 嵌入式注释背景色：浅蓝 #E0EEFF。

colour.embedded.js=back:#F0F0FF
# 嵌入式 JavaScript 背景色：极浅蓝 #F0F0FF。

colour.notused=back:#FF0000
# “未使用”标记背景色：红色 #FF0000。

colour.number=fore:#000000
# 数字前景色：黑色 #000000。

colour.keyword=fore:#FF0000
# 关键字前景色：红色 #FF0000。

colour.string=fore:#008000
# 字符串前景色：绿色 #008000。

colour.char=fore:#7F007F
# 字符常量前景色：紫色 #7F007F。

colour.operator=fore:#0000FF
# 运算符前景色：蓝色 #0000FF。

colour.preproc=fore:#7F7F00
# 预处理指令前景色：橄榄色 #7F7F00。

colour.error=fore:#FFFF00,back:#FF0000
# 错误标记：前景黄 #FFFF00，背景红 #FF0000。

# Whitespace, indentation guides and margins
# 空白字符、缩进参考线与边距
view.whitespace=1
# 显示空白字符（空格和制表符）。1 为开启。

view.indentation.whitespace=1
# 在缩进区域也显示空白字符。1 为开启。

whitespace.fore=#E40082
# 空白字符颜色：品红 #E40082。

whitespace.size=2
# 空白字符显示点大小：2 像素。

view.indentation.guides=1
# 显示缩进参考线（竖线）。1 为开启。

view.indentation.examine=3
# 缩进检查模式。3 表示同时检查前后行来确定缩进层级。

highlight.indentation.guides=1
# 高亮当前缩进层级的参考线。1 为开启。

blank.margin.left=10
# 左侧空白边距：10 像素。

blank.margin.right=10
# 右侧空白边距：10 像素。

margin.width=16
# 行号边距宽度：16 像素。

line.margin.visible=1
# 显示行号边距。1 为开启。

line.margin.width=3+
# 行号边距宽度：3 个字符宽，+ 表示随行号位数自动扩展。

# Selection and caret
# 选区与光标
selection.fore=#000000
# 选中文本前景色：黑色 #000000。

selection.back=#80CEF3
# 选中文本背景色：天蓝 #80CEF3。

selection.layer=1
# 选区绘制层级：1。数值越大越靠上层。

selection.always.visible=1
# 选区始终可见。1 表示失去焦点时仍显示选区。

caret.fore=#FF0000
# 光标颜色：红色 #FF0000。

caret.line.back=#00A2E9
# 当前行高亮背景色：蓝色 #00A2E9。

caret.line.layer=1
# 当前行高亮绘制层级：1。

caret.line.frame=2
# 当前行高亮边框宽度：2 像素。

caret.period=500
# 光标闪烁周期：500 毫秒。

caret.width=2
# 光标宽度：2 像素。

# Long-line guide
# 长行参考线
edge.column=80
# 长行参考线位于第 80 列。

edge.mode=1
# 参考线模式：1，显示一条竖线。

edge.colour=#00FF00
# 参考线颜色：绿色 #00FF00。

# Saving cleanup
# 保存时清理
strip.trailing.spaces=1
# 保存时删除行尾多余空格。1 为开启。

ensure.final.line.end=1
# 保存时确保文件末尾有换行符。1 为开启。

ensure.consistent.line.ends=1
# 保存时确保行尾符一致（统一 LF 或 CRLF）。1 为开启。

# Completion and HTML/XML editing
# 自动完成与 HTML/XML 编辑
autocomplete.choose.single=0
# 只有一个候选项时不自动选中。0 表示不自动选择。

autocomplete.visible.item.count=15
# 自动完成列表最多显示 15 个候选项。

# SciTE enables document-word completion only for the exact value 1.
# Keep the original value 2 so normal typing and Tab indentation are not intercepted.
# SciTE 仅在值为 1 时启用文档单词完成。
# 保留原值 2，以免正常打字和 Tab 缩进被拦截。
autocompleteword.automatic=2
# 文档单词自动完成：2（不启用）。

xml.auto.close.tags=0
# 不自动关闭 XML/HTML 标签。0 为关闭。

asp.default.language=1
# ASP 默认语言：1（通常指 JavaScript，0 为 VBScript）。

html.tags.case.sensitive=0
# HTML 标签大小写不敏感。0 表示不区分大小写。

# View and wrapping
# 视图与换行
magnification=1
# 整体缩放级别：1，即放大一级。0 为正常，负值缩小。

wrap=1
# 自动换行开启。1 表示长行在窗口宽度处折行。

wrap.aware.home.end.keys=0
# Home/End 键不感知换行。0 表示跳到逻辑行首/行尾，而非视觉行首/行尾。

# Folding
# 折叠
fold.symbols=2
# 折叠符号样式：2，在折叠边距中显示圆形加号/减号。

fold.margin.width=20
# 折叠边距宽度：20 像素。

fold.margin.colour=#00FF00
# 折叠边距背景色：绿色 #00FF00。

fold.margin.highlight.colour=#00FF00
# 折叠边距高亮颜色：绿色 #00FF00。

# Scintilla uses marker fore as the circle fill and marker back as its
# outline/plus/minus colour.
# Scintilla 使用 marker 前景色作为圆形填充色，
# marker 背景色作为轮廓及加号/减号颜色。
fold.fore=#FFFFFF
# 折叠标记前景色：白色 #FFFFFF（圆形填充色）。

fold.back=#000000
# 折叠标记背景色：黑色 #000000（轮廓及加号/减号颜色）。

# Indentation
# 缩进
tabsize=8
# 制表符宽度：8 个字符。

indent.size=4
# 缩进大小：4 个字符。

use.tabs=0
# 不使用制表符缩进。0 表示用空格代替 Tab。

indent.auto=1
# 自动缩进开启。1 表示新行继承上一行缩进。

tab.indents=1
# Tab 键用于缩进。1 表示按 Tab 增加缩进。

backspace.unindents=1
# 退格键取消缩进。1 表示在缩进空白处按退格减少一级缩进。

indent.automatic=1
# 自动缩进开启（控制自动缩进行为）。

indent.opening=1
# 左大括号 { 后自动增加缩进。1 为开启。

indent.closing=1
# 右大括号 } 前自动减少缩进。1 为开启。
