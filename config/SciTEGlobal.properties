# EditMdView portable defaults
#
# This file intentionally contains only editor settings implemented by the
# plugin. SciTE window, menu, build, run, print, export, session, Lua, API and
# call-tip settings are deliberately not shipped.

# Rendering
technology=1
buffered.draw=1
phases.draw=2

# Baseline fonts. SciTEUser.properties supplies the portable user choice.
font.base=font:Cascadia Mono,normal,size:11
font.comment=$(font.base)
font.monospace=$(font.base)
font.code.comment.box=$(font.comment)
font.code.comment.line=$(font.comment)
font.code.comment.doc=$(font.comment)
font.text=$(font.base)
font.text.comment=$(font.comment)
font.vbs=$(font.base)
font.js=$(font.comment)

# Shared lexer variables referenced by the curated language files
chars.alpha=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
chars.numeric=0123456789
chars.accented=ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ
colour.code.comment.box=fore:#007F00
colour.code.comment.line=fore:#007F00
colour.code.comment.doc=fore:#3F703F
colour.embedded.js=back:#F0F0FF
colour.number=fore:#007F7F
colour.keyword=fore:#00007F
colour.string=fore:#7F007F
colour.char=fore:#7F007F
colour.operator=fore:#000000
colour.preproc=fore:#7F7F00
traits.inactive=
keywordclass.python=and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield match case
keywordclass.vb=AddHandler AddressOf Alias And AndAlso As Boolean ByRef Byte ByVal Call Case Catch CBool CByte CChar CDate CDec CDbl Char CInt Class CLng CObj Const Continue CSByte CShort CSng CStr CType CUInt CULng CUShort Date Decimal Declare Default Delegate Dim DirectCast Do Double Each Else ElseIf End Enum Erase Error Event Exit False Finally For Friend Function Get GetType Global GoSub GoTo Handles If Implements Imports In Inherits Integer Interface Is IsNot Let Lib Like Long Loop Me Mod Module MustInherit MustOverride MyBase MyClass Namespace Narrowing New Next Not Nothing NotInheritable NotOverridable Object Of On Operator Option Optional Or OrElse Overloads Overridable Overrides ParamArray Partial Private Property Protected Public RaiseEvent ReadOnly ReDim REM RemoveHandler Resume Return SByte Select Set Shadows Shared Short Single Static Step Stop String Structure Sub SyncLock Then Throw To True Try TryCast TypeOf UInteger ULong UShort Using Variant Wend When While Widening With WithEvents WriteOnly Xor

# Global styles
style.*.32=$(font.base)
style.*.33=back:#E7E7E7,$(font.base)
style.*.34=fore:#0000FF,bold
style.*.35=fore:#FF0000,bold
style.*.36=
style.*.37=fore:#C0C0C0,back:#FFFFFF

# Keep configured comment typography without replacing the built-in colours.
style.cpp.1=$(font.comment)
style.cpp.2=$(font.comment)
style.cpp.3=$(font.comment)

# Editor behaviour
braces.check=1
braces.sloppy=1
eol.auto=1
markdown.edit.shortcuts=1
markdown.slash.commands=1
markdown.smart.editing=1
fold=1
fold.compact=1
fold.comment=1
fold.preprocessor=1
fold.flags=16

# Caret scrolling policy
caret.policy.xslop=1
caret.policy.width=20
caret.policy.xstrict=0
caret.policy.xeven=0
caret.policy.xjumps=0
caret.policy.yslop=1
caret.policy.lines=1
caret.policy.ystrict=1
caret.policy.yeven=1
caret.policy.yjumps=0

# Curated language definitions. These files contain only supported lexer data.
import conf
import cpp
import html
import lisp
