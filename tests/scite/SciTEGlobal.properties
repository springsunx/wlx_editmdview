# Integration test for SciTE-compatible editor configuration.
properties.directory.enable=1
base.size=13
accent=#123456
style.*.32=font:Cascadia Mono,size:$(base.size),fore:$(accent)
font.comment=font:Courier New,normal,size:17
style.python.1=font:Arial,normal,size:19
file.patterns.test=*.foo
lexer.$(file.patterns.test)=python
tabsize.$(file.patterns.test)=2
indent.size.$(file.patterns.test)=2
use.tabs.$(file.patterns.test)=0
wrap.$(file.patterns.test)=0
view.indentation.guides=1
line.margin.visible=1
fold=1
keywords.$(file.patterns.test)=and as assert async await class def else False for from if import in is lambda None not or pass return True while
